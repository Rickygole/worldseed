  # ------------------------------------------------------------------ corridor priority (speed factor on a registered corridor)
  - id: CP-BELTWAY-FLOW
    type: signal_priority
    kind: corridor_priority
    title: "Hypothetical scenario option: flow management on the Baltimore Beltway"
    mechanism: >
      Applies faster clearance of incidents and smoother merging along the whole Baltimore Beltway corridor,
      including the western arc that becomes the detour when the Key Bridge is gone. Every road segment of the
      corridor gets a modest speed gain. It only helps trips that use the Beltway.
    corridor: C-I695
    factor: {assumption: A-CORRIDOR-FACTOR-FREEWAY}
    lens: [access, xharbor, ems]
    costTier: "$$"
    leadTime: months
    assumptions: [A-CANDIDATES-HYPOTHETICAL, A-CORRIDOR-FACTOR-FREEWAY]
  - id: CP-HARBOR-TUNNEL-BORES
    type: signal_priority
    kind: corridor_priority
    title: "Hypothetical scenario option: tunnel flow management, Harbor Tunnel"
    mechanism: >
      Applies faster incident clearance and traffic metering to the tunnel bores of the Harbor Tunnel only, not to
      its approaches. Every tunnel segment gets a modest speed gain. It helps trips that cross the harbor by tunnel.
    corridor: C-I895-TUNNEL
    factor: {assumption: A-CORRIDOR-FACTOR-FREEWAY}
    lens: [access, xharbor, ems]
    costTier: "$"
    leadTime: weeks
