  # ------------------------------------------------------------------ hazmat windows (lift the tunnel prohibition for the hazmat vehicle class)
  - id: HW-HARBOR-TUNNEL-ESCORT
    type: hazmat_window
    kind: hazmat_window
    title: "Hypothetical scenario option: scheduled escorted window for hazardous-materials vehicles in the Harbor Tunnel"
    mechanism: >
      Allows vehicles that carry hazardous materials to use the Harbor Tunnel during a scheduled, escorted window,
      at the price of a fixed extra delay for each passage through the tunnel. It changes nothing for cars. It only
      shortens freight trips that would otherwise have to take the long way around the harbor. This is a
      scenario-only lever; whether such a window is allowed is a matter for the responsible agencies.
    hazmatLink: L-HARBORTUNNEL
    penalty: {assumption: A-HAZMAT-ESCORT-PENALTY}
    lens: [freight]
    costTier: "$$"
    leadTime: months
    assumptions: [A-CANDIDATES-HYPOTHETICAL, A-HAZMAT-ESCORT-PENALTY, A-HAZMAT-TUNNELS]
