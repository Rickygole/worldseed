# Hypothetical scenario option catalog (source of truth for candidates.json and the appended graph edges).
#
# Every entry is a HYPOTHETICAL scenario option. None was proposed, studied or endorsed by any agency.
# Titles and mechanisms contain no digits (a language model reads them). Numeric effects live in the
# `effect` and `params` fields and come from labeled assumptions in assumptions.yaml.
# Sites are pinned by OSM node id (and checked against the names of the ways that touch the node) or by
# facility name in facilities.json; build_candidates.py fails the build if any reference does not resolve.
#
# type (contract 2.3):  temp_link | signal_priority | prepos_site
# kind (readable alias): temporary_link | corridor_priority | staging_site
version: 1
candidates:
  # ------------------------------------------------------------------ temporary links (edges disabled in the baseline)
  - id: TL-SHUTTLE-TRADEPOINT-HAWKINS
    type: temp_link
    kind: temporary_link
    title: "Hypothetical scenario option: harbor shuttle link, Tradepoint Atlantic to Hawkins Point"
    mechanism: >
      Adds a scenario-only shuttle connection between the Tradepoint Atlantic road network on the north bank and
      the Fort Armistead road network at Hawkins Point on the south bank, roughly where the Key Bridge used to
      cross. It is modeled as a fixed boarding wait plus a straight-line crossing at constant speed, in both
      directions. Disabled in the baseline; enabling it lets cross-harbor trips skip the long drive around the harbor. It carries people and cars only: vehicles carrying hazardous materials cannot use it.
    lens: [access, xharbor, ems]
    costTier: "$$"
    leadTime: months
    assumptions: [A-CANDIDATES-HYPOTHETICAL, A-SHUTTLE-SPEED, A-SHUTTLE-WAIT, A-SHUTTLE-NO-HAZMAT]
    link:
      mode: shuttle
      a: {osmNode: 9222322309, expectNames: [Tradepoint Avenue], site: "Tradepoint Atlantic, Tradepoint Avenue at Plate Mill Road"}
      b: {osmNode: 49379171, expectNames: [Dock Road, Fort Armistead Road], site: "Dock Road at Fort Armistead Road, Hawkins Point"}
